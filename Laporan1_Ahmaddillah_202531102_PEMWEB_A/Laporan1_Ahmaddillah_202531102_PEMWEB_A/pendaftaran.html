<html>
<head>
    <title>Laporan Praktikum Pendaftaran</title>
</head>
<body>
    <nav>
        <a href="index.html">Beranda</a> | 
        <a href="pendaftaran.html">Pendaftaran</a>
    </nav>
    <hr>
    <h2>Form Pendaftaran Praktikan</h2>
    <form method="post" action="">
        <table>
            <tr>
                <td><label for="nama">Nama Lengkap</label></td>
                <td>: <input type="text" name="nama" id="nama"></td>
            </tr>
            <tr>
                <td><label for="pass">Password</label></td>
                <td>: <input type="password" name="pass" id="pass"></td>
            </tr>
            <tr>
                <td><label for="nim">NIM</label></td>
                <td>: <input type="number" name="nim" id="nim"></td>
            </tr>
            <tr>
                <td><label for="tgl">Tanggal Lahir</label></td>
                <td>: <input type="date" name="tgl" id="tgl"></td>
            </tr>
            <tr>
                <td><label>Jenis Kelamin</label></td>
                <td>: 
                    <input type="radio" name="jk" value="L" id="jkL"> <label for="jkL">Laki-Laki</label> 
                    <input type="radio" name="jk" value="P" id="jkP"> <label for="jkP">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td><label>Minat bidang</label></td>
                <td>: 
                    <input type="checkbox" name="minat" value="web"> Web 
                    <input type="checkbox" name="minat" value="network"> Jaringan 
                    <input type="checkbox" name="minat" value="Design/Modeling"> Design/Modeling
                </td>
            </tr>
            <tr>
                <td><label for="prodi">Program Studi</label></td>
                <td>: 
                    <select name="prodi" id="prodi">
                        <option value="IF">S1 Teknik Informatika</option>
                        <option value="SI">S1 Sistem Informasi</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="alasan">Alasan Mendaftar</label></td>
                <td>: <textarea name="alasan" id="alasan" rows="3" cols="20"></textarea></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <button type="submit">Kirim</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
